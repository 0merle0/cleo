[project]
name = "cleo"
version = "0.1.0"
description = "Combinatorial Libraries for Exploration and Optimization"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "boltz",
    "torch>=2.2",
    "numpy>=1.26,<2.0",
    "hydra-core==1.3.2",
    "pytorch-lightning==2.5.0",
    "rdkit>=2024.3.2",
    "dm-tree==0.1.8",
    "requests==2.32.3",
    "pandas>=2.2.2",
    "types-requests",
    "einops==0.8.0",
    "einx==0.3.0",
    "fairscale==0.4.13",
    "mashumaro==3.14",
    "modelcif==1.2",
    "wandb==0.18.7",
    "click==8.1.7",
    "pyyaml==6.0.2",
    "biopython==1.84",
    "scipy==1.13.1",
    "numba==0.61.0",
    "gemmi==0.6.5",
    "scikit-learn==1.6.1",
    "chembl_structure_pipeline==1.2.2",
    "prody",
    "biotite",
    "dnachisel",
    "matplotlib",
    "seaborn",
    "jupyter",
]

[project.scripts]
cleo-design-train = "cleo.design.train_policy:train_policy"
cleo-design-sample = "cleo.design.sample_from_policy:sample_from_policy"
cleo-design-resample = "cleo.design.resample_fragments:resample_fragments"
cleo-design-evaluate = "cleo.design.evaluate_sequences:evaluate_sequences"
cleo-design-dna = "cleo.design.dna_utils.dna_fragment_design:main"
cleo-optimize-train = "cleo.optimize.train_surrogate:train_surrogate"
cleo-optimize-batch = "cleo.optimize.batch_optimize:main"
cleo-optimize-predict = "cleo.optimize.predict_fasta:main"

[project.optional-dependencies]
cuda = ["boltz[cuda]"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"