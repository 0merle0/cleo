run_name: metallopetase_test # name for the run
output_dir: /home/jgershon/projects/itopt/policy_mpnn
pdb: /projects/ml/itopt/policy_mpnn/benchmarks/metallo_petase/reference_str.pdb

batch_size: 2
N_steps: 500
lr: 1e-4 # learning rate slowed for protease
checkpoint_every_n_steps: 10
evaluate_every_n_steps: 500 # dont want eval for now
eval: false
checkpoint_path: null
algorithm: dapo

use_avg_reward: false
avg_reward_window: 5 # number of steps to use for average reward

# USE KL ref
use_ref_kl: true
kl_weight: 1e-2

# -- DAPO params --
N_updates: 16 # number of rollouts per step
update_batch_size: 8 # number of rollouts to use for each update
clip_eps_low: 0.2 # lower bound for clipping value taken from paper
clip_eps_high: 0.28 # upper bound for clipping value taken from paper

# -- MPNN params --
model_type: ligand_mpnn # protein_mpnn or ligand_mpnn
temperature: 1.0 # default temperature
omit_AA: CX

fixed_residues: A35 A36 A37 A38 A39 A40 A43 A70 A71 A72 A74 A90 A94 A108 A109 A110 A111


reward: &default_reward
  _target_: reward_utils.MetalloPETase
  pipeline_config_path: /projects/ml/itopt/policy_mpnn/software/pipelines/pipelines/configs/reward_metallopetase.yaml
  output_dir: ${output_dir}
  run_name: ${run_name} # name for the run
  iptm_lb: 0.0
  iptm_ub: 0.9
  iptm_weight: 1.0
  ligand_rmsd_ub: 10.0
  ligand_rmsd_lb: 0.0
  ligand_rmsd_weight: 1.0
  as_rmsd_lb: 0.0
  as_rmsd_ub: 10.0
  as_rmsd_weight: 1.0
  as_plddt_lb: 50.0
  as_plddt_ub: 90.0
  as_plddt_weight: 1.0

  frag_cfg:
    fragment_bounds: [[0,35],[36,70],[71,108],[109,142]]
    sample_size: 2
    min_sample: 0


evaluate:
  chkpt_path: null # Can be overridden
  temperature: 0.5
  batch_size: ${batch_size}   # Number of sequences per rollout batch
  num_batches: 1  # Number of batches to run
  reward: 
    <<: *default_reward  # Inherit all default reward settings