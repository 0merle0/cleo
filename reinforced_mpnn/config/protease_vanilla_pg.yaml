fixed_residues: "A40 A43 A45 A60 A65 A100 B7 B8" # residues to keep fixed


reward:
  _target_: reward_utils.AF3RMSDPipelineReward 
  pipeline_config_path: /projects/ml/itopt/policy_mpnn/software/pipelines/pipelines/configs/reward_hojae_protease.yaml
  output_dir: ${output_dir}
  rmsd_ub: 10.0
  rmsd_lb: 0.0
  frag_cfg:
