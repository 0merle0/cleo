run_name: protease_vanilla_pg_fragmented_5frag # name for the run
output_dir: /home/jgershon/projects/itopt/policy_mpnn/protease_vanilla_pg_fragmented_5frag
pdb: /projects/ml/itopt/policy_mpnn/benchmarks/protease/promising_24_hojae.cif
batch_size: 16
N_steps: 500
lr: 1e-4
checkpoint_every_n_steps: 10
eval: false
checkpoint_path: null
algorithm: vanillaPG

