run_name: protease_dapo_frags_promising24_zero_pad  # name for the run
output_dir: /home/jgershon/projects/itopt/policy_mpnn
pdb: /projects/ml/itopt/policy_mpnn/benchmarks/protease/promising_24_hojae.cif
# pdb: /projects/ml/itopt/policy_mpnn/benchmarks/protease/promising_14_hojae.cif
# pdb: /projects/ml/itopt/policy_mpnn/benchmarks/protease/promising_13_hojae.cif

batch_size: 32
N_steps: 500
lr: 1e-4 # learning rate slowed for protease
checkpoint_every_n_steps: 10
eval: false
checkpoint_path: null
algorithm: dapo

# -- DAPO params --
N_updates: 16 # number of rollouts per step
update_batch_size: 8 # number of rollouts to use for each update
clip_eps_low: 0.2 # lower bound for clipping value taken from paper
clip_eps_high: 0.28 # upper bound for clipping value taken from paper

# -- MPNN params --
model_type: protein_mpnn # protein_mpnn or ligand_mpnn
temperature: 1.0 # lower temp
omit_AA: CX

# for promising 24
fixed_residues: "A40 A43 A45 A60 A65 A100 B1 B2 B3 B4 B5 B6 B7 B8" # residues to keep fixed

# for promising 14
# fixed_residues: "A94 A133 A148 B1 B2 B3 B4 B5 B6 B7 B8" # residues to keep fixed

# for promising 13
# fixed_residues: "A88 A111 A127 B1 B2 B3 B4 B5 B6 B7 B8" # residues to keep fixed

reward:
  _target_: reward_utils.AF3RMSDPipelineReward 
  pipeline_config_path: /projects/ml/itopt/policy_mpnn/software/pipelines/pipelines/configs/reward_protease_promising_24.yaml  
  # pipeline_config_path: /projects/ml/itopt/policy_mpnn/software/pipelines/pipelines/configs/reward_protease_promising_14.yaml  
  # pipeline_config_path: /projects/ml/itopt/policy_mpnn/software/pipelines/pipelines/configs/reward_protease_promising_13.yaml  

  output_dir: ${output_dir}
  run_name: ${run_name} # name for the run
  rmsd_ub: 15.0
  rmsd_lb: 0.0
  frag_cfg:
    fragment_bounds: [[0,24],[25,49],[50,74],[75,99],[100,124],[125,149],[150,184]] # 7 fragments, diverged
    # fragment_bounds: [[0,30],[31,75],[76,117],[118,150],[150,184]] # 5 fragments, diverged
    # fragment_bounds: [[0,30],[31,78],[79,134],[135,184]] # 4 fragments, diverged
    # fragment_bounds: [[0,75],[76,120],[121,184]] # 3 fragments, 
    # fragment_bounds: [[0,99],[100,184]] # 2 fragments, 
    # fragment_bounds: [[0,2],[3,184]] # 2 fragments, CONVERGED
    # fragment_bounds: [[0,32], [33,52], [53,94], [95,105], [106,133], [134, 150], [151,184]] # 7 fragments, 
    sample_size: 128
    min_sample: 2