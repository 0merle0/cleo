run_name: run_M0157_1qh5_cond13_50
output_dir: experiments/ame/runs/run_M0157_1qh5_cond13_50
pdb: experiments/ame/targets/run_M0157_1qh5_cond13_50-atomized-bb-True.pdb
checkpoint_path: null
algorithm: grpo
batch_size: 16
N_steps: 40
lr: 0.0001
checkpoint_every_n_steps: 20
kl_weight: 0.0
N_updates: 16
update_batch_size: 8
clip_eps_low: 0.2
clip_eps_high: 0.28
model_type: ligand_mpnn
ligand_mpnn_use_side_chain_context: 1
temperature: 1.0
omit_AA: CX
fixed_residues: A46 A50 A51 A52 A53 A74 A114
reward:
  _target_: cleo.design.utils.reward.UniversalReward
  output_dir: ${output_dir}
  run_name: ${run_name}
  steps:
  - name: af3
    target_fn: cleo.design.utils.oracle.af3_from_df
    cfg:
      rundir: experiments/ame/runs/run_M0157_1qh5_cond13_50
      template_path: experiments/ame/templates/run_M0157_1qh5_cond13_50.json
      af3_container: /net/software/containers/af3.sif
      af3_script: /opt/alphafold3/run_alphafold.py
      model_dir: /net/databases/alphafold
  - name: ame
    target_fn: cleo.design.utils.rfd2_benchmark.rfd2_metrics_from_df
    cfg:
      design_pdb: experiments/ame/targets/run_M0157_1qh5_cond13_50-atomized-bb-True.pdb
      trb: experiments/ame/targets/run_M0157_1qh5_cond13_50-atomized-bb-True.trb
      motif_atoms:
        A53:
        - NE2
        - CD2
        - CE1
        A51:
        - ND1
        - CG
        - CE1
        - CB
        - CD2
        - NE2
        A50:
        - OD2
        - CG
        A52:
        - NE2
        - CD2
        - CE1
        A74:
        - NE2
        - CD2
        - CE1
        A46:
        - OD2
        - CG
        A114:
        - NE2
        - CD2
        - CE1
      structure_col: af3_path
  reward_aggregation:
  - metric: ame_motif_rmsd
    lower_bound: 0.5
    upper_bound: 6.0
    weight: 1.0
    mode: min
