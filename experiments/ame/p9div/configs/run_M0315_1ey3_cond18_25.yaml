run_name: run_M0315_1ey3_cond18_25
output_dir: experiments/ame/runs9div/run_M0315_1ey3_cond18_25
pdb: experiments/ame/targets12/run_M0315_1ey3_cond18_25-atomized-bb-True.pdb
checkpoint_path: null
algorithm: grpo
batch_size: 32
N_steps: 200
lr: 0.0001
checkpoint_every_n_steps: 25
kl_weight: 0.0
N_updates: 16
update_batch_size: 8
clip_eps_low: 0.2
clip_eps_high: 0.28
model_type: ligand_mpnn
ligand_mpnn_use_side_chain_context: 1
temperature: 1.0
omit_AA: CX
fixed_residues: A90 A124
reward:
  _target_: cleo.design.utils.reward.UniversalReward
  output_dir: ${output_dir}
  run_name: ${run_name}
  steps:
  - name: div
    target_fn: cleo.design.utils.mutation_diversity.mutation_diversity_from_df
    cfg: {}
  - name: af3
    target_fn: cleo.design.utils.oracle.af3_from_df
    cfg:
      rundir: experiments/ame/runs9div/run_M0315_1ey3_cond18_25
      template_path: experiments/ame/p9div/templates/run_M0315_1ey3_cond18_25.json
      af3_container: /net/software/containers/af3.sif
      af3_script: /opt/alphafold3/run_alphafold.py
      model_dir: /net/databases/alphafold
  - name: ame
    target_fn: cleo.design.utils.rfd2_benchmark.rfd2_metrics_from_df
    cfg:
      design_pdb: experiments/ame/targets12/run_M0315_1ey3_cond18_25-atomized-bb-True.pdb
      trb: experiments/ame/targets12/run_M0315_1ey3_cond18_25-atomized-bb-True.trb
      motif_atoms:
        A23:
        - N
        - CA
        A22:
        - N
        - CA
        A90:
        - OE1
        - CD
        - CG
        - OE2
        A124:
        - OE2
        - CD
      structure_col: af3_path
  reward_aggregation:
  - metric: ame_motif_rmsd
    lower_bound: 0.5
    upper_bound: 6.0
    weight: 1.0
    mode: min
    normalize: zscore
  - metric: div_marginal_fraction
    lower_bound: 0.05
    upper_bound: 0.35
    weight: 1.0
    mode: max
    normalize: zscore
