run_name: run_M0552_1fgh_cond23_91
output_dir: experiments/ame/runs9/run_M0552_1fgh_cond23_91
pdb: experiments/ame/targets12/run_M0552_1fgh_cond23_91-atomized-bb-True.pdb
checkpoint_path: null
algorithm: grpo
batch_size: 32
N_steps: 200
lr: 0.0001
checkpoint_every_n_steps: 25
kl_weight: 0.0
N_updates: 16
update_batch_size: 8
clip_eps_low: 0.2
clip_eps_high: 0.28
model_type: ligand_mpnn
ligand_mpnn_use_side_chain_context: 1
temperature: 1.0
omit_AA: CX
fixed_residues: A12 A16 A52 A56 A84 A175
reward:
  _target_: cleo.design.utils.reward.UniversalReward
  output_dir: ${output_dir}
  run_name: ${run_name}
  steps:
  - name: af3
    target_fn: cleo.design.utils.oracle.af3_from_df
    cfg:
      rundir: experiments/ame/runs9/run_M0552_1fgh_cond23_91
      template_path: experiments/ame/p9/templates/run_M0552_1fgh_cond23_91.json
      af3_container: /net/software/containers/af3.sif
      af3_script: /opt/alphafold3/run_alphafold.py
      model_dir: /net/databases/alphafold
  - name: ame
    target_fn: cleo.design.utils.rfd2_benchmark.rfd2_metrics_from_df
    cfg:
      design_pdb: experiments/ame/targets12/run_M0552_1fgh_cond23_91-atomized-bb-True.pdb
      trb: experiments/ame/targets12/run_M0552_1fgh_cond23_91-atomized-bb-True.trb
      motif_atoms:
        A16:
        - OD2
        - CG
        A12:
        - NE2
        - CD2
        - CE1
        A175:
        - OD1
        - CG
        - CB
        - OD2
        A84:
        - NH1
        - CZ
        A56:
        - OG
        - CB
        - CA
        A52:
        - NE
        - CD
        - CZ
      structure_col: af3_path
  reward_aggregation:
  - metric: ame_motif_rmsd
    lower_bound: 0.5
    upper_bound: 6.0
    weight: 1.0
    mode: min
