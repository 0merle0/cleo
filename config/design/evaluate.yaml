# Config for evaluating sampled sequences through the metric pipeline
#
# Usage:
#   python -m cleo.design.evaluate_sequences --config-name evaluate
#
# Takes a FASTA file of sequences and runs them through the same step-based
# pipeline used during training (folding, petase metrics, distance to
# reference sequences, etc.). Outputs a CSV with all computed metrics.
#
# FOLDS WITH AF3, WHICH IS HELD OUT OF TRAINING. Training draws from a pool of
# [rf3, boltz, protenix] and AF3 never enters the objective, so this is the
# only oracle here whose number measures the policy rather than how well the
# policy learned its training oracle's quirks. On M0097 that difference was
# +18 to +36 points. See TRAINING_PROTOCOL.md.
#
# This used to fold with Boltz -- one of the three training oracles -- so
# evaluations produced before this change are NOT held-out measurements and
# are not comparable with ones produced after it.

input_fasta: ${hydra:runtime.cwd}/example_data/library_design/resampled_sequences/example_resampled.fasta

output_dir: ${hydra:runtime.cwd}/evaluation_results
output_name: evaluation_results

# Metric pipeline steps — same format as reward.steps in the training config.
# Each step has a name, a target function, and a cfg dict.
# Steps run in order, each augmenting the DataFrame with new columns.
steps:

  - name: af3
    target_fn: cleo.design.utils.oracle.af3_from_df
    cfg:
      # rundir is set automatically by the script.
      #
      # The AF3 JSON template, not Boltz's YAML. Every oracle translates from
      # this one file, so an evaluation folds the identical complex the
      # training oracles did -- the PET dimer travels as SMILES, which all of
      # them now handle.
      template_path: ${hydra:runtime.cwd}/templates/oracle/petase_af3_template.json
      # Site paths. Change these for your cluster.
      af3_container: /net/software/containers/af3.sif
      af3_script: /opt/alphafold3/run_alphafold.py
      model_dir: /net/databases/alphafold
      num_diffusion_samples: 5
      per_sample_rows: true

  - name: petase_metrics
    target_fn: cleo.design.utils.petase.add_petase_metrics_to_df
    cfg:
      ref_step: af3
      cat_res_ser: 66
      cat_res_his: 107
      cat_res_asp: 122
      oxhres1: 198
      oxhres2: 67
      ester_atom_list: [["C35","O25","O31"], ["C36","O26","O32"]]
      dihedrals: [[["A",107,"NE2"], ["A",66,"OG"], ["B",1,"C35"], ["B",1,"O31"]], [["A",107,"NE2"], ["A",66,"OG"], ["B",1,"C36"], ["B",1,"O32"]]]
      ref_str: ${hydra:runtime.cwd}/templates/structure/momi_petase_reference_structure.pdb
      ref_protein_chain_id: A
      ref_ligand_chain_id: X
      des_protein_chain_id: A
      des_ligand_chain_id: B
      ref_ligand_atom_names: ["C13","O2","C1","O1","C10","C8","C7","C9","C11","C6","C5","O4","O3","C4","C3","O6","C14","O7","C15","O8","C16","C21","C20","C17","C18","C19","C22","O9","O10","C23","C24","O11"]
      design_ligand_atom_name_orders: [
        ["C53","O31","C35","O25","C47","C42","C38","C41","C37","C45","C33","O23","O29","C51","C49","O27","C54","O32","C36","O26","C48","C43","C39","C44","C40","C46","C34","O24","O30","C52","C50","O28"],
        ["C54","O32","C36","O26","C48","C43","C39","C44","C40","C46","C34","O24","O30","C52","C50","O28","C53","O31","C35","O25","C47","C42","C38","C41","C37","C45","C33","O23","O29","C51","C49","O27"]
      ]

  - name: dist_to_ref_seqs
    target_fn: cleo.design.utils.sequence.compute_dist_to_ref_seqs_from_df
    cfg:
      ref_seqs:
        - MGWEEDLWLERPSGERTPVRRHHFPAKKAENGESAIANVERLIEEIEASGITFTATADRAVVVGWSLGVITGMIMHATGTDFITALRKALEIGKKVKEEDPEFMERHKKIVTDGNRAEIREDIDYWIEVIEKETGHAVDNARIFIATTVEEAVELARRAVELGHAIIHLPPYVIGEAGEAVVEVLAAAGVDVLLMGGLGSGVPVTIYQA
        - MGWEEDLWLERPSGERTPVRRHHFPAKKAENGESAIANVERLIEEIEASGITFTATADRAVVVGWSLGVITGMIMHATGTDFITALRKALEIGKKVKEEDPEFMERHKKIVTDGNRAEIREDIDYWIEVIQKETGHKVDKSRIFIAETVEEAIELARQAVELGHAIIHLPPYVIGEAGEAVVEVLAAAGVDVLLMGGLGSGVPVTIYQA
        - MGWEEDLWLERPSGERTPVRRHHFPAKKAENGESAIANVERLIEEIEASGITFTATADRAVVVGWSLGVITGMIMHATGTDFITALRKALEIGKKVKEEDPEFMERHKKIVTDGNRAEIREDIDYWIEVIEKETGHAVDRSRIFIAETVEEAVELAARAVELGHAIIHLPPYVIGEAGEAVVEVLAAAGVDVLLMGGLGSGVPVTIYQA

  # COLLAPSE THE 5 SAMPLES TO ONE ROW PER SEQUENCE.
  #
  # Every oracle defaults to num_diffusion_samples: 5 with per_sample_rows
  # following it, so without this step the output CSV carries five rows per
  # sequence and the "Wrote metrics for N sequences" line counts rows, not
  # sequences. Anything averaging that file silently weights a sequence by how
  # many of its predictions parsed.
  #
  # "Best" is defined the same way the PETase reward defines it, so the sample
  # an evaluation reports is the one the objective would have picked. It is
  # the same list as denovo_petase.yaml's reward_aggregation with the two
  # oracle-confidence terms renamed: there they read `fold_*`, the pooled
  # training oracle, and here `af3_*`. Keep the rest in step.
  - name: bo5
    target_fn: cleo.design.utils.best_of_n.best_of_n_from_df
    cfg:
      group_col: name
      aggregation:
        - {metric: af3_iptm, lower_bound: 0.0, upper_bound: 0.8, weight: 1.0, mode: max}
        - {metric: af3_ptm, lower_bound: 0.0, upper_bound: 0.8, weight: 1.0, mode: max}
        - {metric: petase_metrics_acylox_oxh1bbN, lower_bound: 6, upper_bound: 10.0, weight: 1.0, mode: min}
        - {metric: petase_metrics_acylox_oxh2bbN, lower_bound: 6, upper_bound: 10.0, weight: 1.0, mode: min}
        - {metric: petase_metrics_hisNE2_esterox, lower_bound: 5, upper_bound: 10.0, weight: 1.0, mode: min}
        - {metric: petase_metrics_hisNE2_serOG, lower_bound: 2.5, upper_bound: 10.0, weight: 1.0, mode: min}
        - {metric: petase_metrics_his_ser_angle, lower_bound: 20, upper_bound: 90, weight: 1.0, mode: max}
        - {metric: dist_to_ref_seqs_min, lower_bound: 0, upper_bound: 100, weight: 10.0, mode: min}

# WHY NOT THE POOL HERE. Training pools oracles so the policy cannot overfit
# any one of them. Evaluation is the opposite problem: it wants ONE fixed
# yardstick, and a pooled evaluation would mix three predictors that disagree
# by up to 26 points on identical designs, so a number would depend on which
# oracle each sequence happened to draw. AF3 alone, held out of training, is
# the yardstick.
