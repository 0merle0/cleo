# Antibody interface reward for the composing dataset (SPEC 6.9) — VHH + Fv uniform.
#
# Same target-agnostic Protenix interface pipeline as `antibody_interface.yaml`, but the
# per-design geometry is carried by ONE `design_chains` column instead of the scalar
# `framework_msa_dir`/`cdr_spans`. `design_chains` = [{length, framework_msa_dir, cdr_spans}, ...]
# in chain order (1 entry for VHH, 2 for Fv); the generalized oracle splits the decoded
# sequence per chain and gaps each chain's framework MSA independently. Lengths are pinned
# by the composer at sample() time so they match the featurizer's CDR-length draw.
requires: [antigen_sequence, antigen_msa_dir, design_chains, epitope_residues]

steps:
  - name: protenix                       # ORACLE step (builds the per-design MSAs internally)
    target_fn: cleo.design.utils.protenix_oracle.protenix_from_df
    cfg:                                 # STATIC, shared across examples (rundir/step reserved)
      cycle: 4
      n_diffusion_step: 20
      n_sample: 1
      use_msa: true
      need_atom_confidence: true         # residue-level PAE for protenix_cdr_interface_pae
    inputs:                              # per-example -> resolved to df columns
      antigen_sequence:  ${native.seq.T}            # co-crystal antigen = chain T (antigen file)
      antigen_msa_dir:   ${row.params.antigen_msa_dir}
      design_chains:     ${row.params.design_chains}  # [{length, framework_msa_dir, cdr_spans}, ...]
      epitope_residues:  ${row.params.epitope_residues}

reward_aggregation:
  - {metric: protenix_interface_iptm,       mode: max, lower_bound: 0.0, upper_bound: 0.8,  weight: 1.0}
  - {metric: protenix_epitope_overlap,      mode: max, lower_bound: 0.0, upper_bound: 1.0,  weight: 1.0}  # precision
  - {metric: protenix_epitope_cdr_coverage, mode: max, lower_bound: 0.0, upper_bound: 1.0,  weight: 1.0}  # recall
  - {metric: protenix_cdr_interface_pae,    mode: min, lower_bound: 0.0, upper_bound: 30.0, weight: 1.0}  # paratope PAE
