debug: false
run_name: momi_mlp_no_val
trainer:
  max_epochs: 200
  log_every_n_steps: 1000
  check_val_every_n_epoch: 1
checkpointer:
  monitor: val/nll
  mode: min
data:
  dataset: data/momi/251218_processed_filtered_data_round0_round1_round2_with_val.csv # combined round0 and round1 data
  train_batch_size: 64
  val_batch_size: 32
  num_workers: 1
  validation_mode: null # random, top-k, label, or null
  top_k_validation: 384
  val_label: val
  val_size: 0.1
  seed: 123
  dataset_cfg:
    input_type: sequence # embedding, sequence, or fragment
    label_col: z_score_norm_rate
    name_col: name
    seq_col: sequence
    input_shape: BD # BLD (keep seq length dim) or BD (flatten seq length dim)
    split_fragments_on: null
    path_connecting_variable: null
    num_fragments_in_subfolder: null
    num_fragments: null
    fragment_csv: null
    path_to_embeddings: null
    embedding_key: null # use:  null for ESM   |   h_V for mpnn
model:
  lr: 1e-4
  num_models: 10
  base_model:
    model_type: mlp # conv1d, mlp, linear, potts
    input_dim: 4180
    hidden_dim: 16
    output_dim: 1
    kernel_size: 5
    p_drop: 0.2
    predict_variance: true # if true, predict variance
    variance_transform: softplus # softplus, sigmoid, clamp
    fixed_variance: 1.0
    output_head_type: mlp # mlp, linear
    stop_grad_variance: false
    use_two_body: true # for potts model if true uses two body terms
  loss:
    mse_weight: 0
    nll_weight: 1
    regularization_order: 2
    regularization_lambda: 0.0
  top_k_accuracy: [10,20,40]