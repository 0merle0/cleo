# This config is to be used as an example fo
debug: false
run_name: RUN_NAME
trainer:
  max_epochs: 200
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
checkpointer:
  monitor: val/nll
  mode: min
data:
  dataset: data/momi/251225_processed_filtered_data_round0_round1_round2_round3_with_val.csv # combined round0 and round1 data
  train_batch_size: 64
  val_batch_size: 32
  num_workers: 1
  validation_mode: label # random, top-k, label, or null
  val_label: val
  dataset_cfg:
    input_type: sequence # only sequence supported in this version
    label_col: z_score_norm_rate
    seq_col: sequence
model:
  lr: 1e-4
  num_models: 10
  base_model:
    model_type: mlp # mlp, linear, potts
    input_dim: 4180
    hidden_dim: 16
    output_dim: 1
    kernel_size: 5
    p_drop: 0.2
    predict_variance: true # if true, predict variance
    variance_transform: softplus # softplus, sigmoid, clamp
    fixed_variance: 1.0
    output_head_type: mlp # mlp, linear
    stop_grad_variance: false
    use_two_body: true # for potts model if true uses two body terms
  loss:
    mse_weight: 0
    nll_weight: 1
    regularization_order: 2
    regularization_lambda: 0.0